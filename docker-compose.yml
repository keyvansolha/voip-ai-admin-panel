services:
  app:
    build: .
    image: voip-ai-admin-panel:latest
    restart: unless-stopped

    # The container writes to /data only, which is the single thing to back up:
    # SQLite database plus stored recordings.
    volumes:
      - voip-data:/data

    environment:
      # Required. Generate with: openssl rand -base64 48
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}

      # Optional first-run admin. Omit to have a random password printed to the
      # container log on first boot.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}

      # Set to true when a TLS-terminating proxy sits in front on plain HTTP,
      # so the session cookie still gets the Secure flag.
      TRUST_PROXY: ${TRUST_PROXY:-true}

    ports:
      # Bound to loopback: put Caddy, nginx or Traefik in front for TLS.
      # Change to "3000:3000" only if the host firewall is doing the work.
      - '127.0.0.1:3000:3000'

    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  voip-data:
